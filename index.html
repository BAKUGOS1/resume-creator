let R = JSON.parse(localStorage.getItem("mohit_resume_classic_data") || JSON.stringify(DEFAULT_DATA));

const esc = s => String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const status = m => { document.getElementById("status").textContent = m; };

/* ---------- On-screen preview ---------- */
function previewHTML(){
  const L = (t,u) => u ? `<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>` : esc(t);
  const row = (left,date,first) => `<div class="row${first?" first":""}"><span>${left}</span><span class="date">${esc(date)}</span></div>`;
  const ul = list => `<ul>${list.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`;
  let h = `<div class="name">${esc(R.name)}</div><div class="title">${esc(R.title)}</div>`;
  h += `<div class="contact">${R.contact.map(l=>l.map(c=>L(c.t,c.u)).join(" · ")).join("<br>")}</div>`;
  h += `<h2>SUMMARY</h2><p class="body">${esc(R.summary)}</p>`;
  h += `<h2>EXPERIENCE</h2>` + R.experience.map((e,i)=>row(`<b>${esc(e.role)}</b>${e.org?" — "+esc(e.org):""}`,e.date,!i)+ul(e.bullets)).join("");
  h += `<h2>PROJECTS</h2>` + R.projects.map((p,i)=>row(`<b>${L(p.name,p.url)}</b> — ${esc(p.desc)}`,p.date,!i)+`<div class="stack">${esc(p.stack)}</div>`+ul(p.bullets)).join("");
  h += `<p class="body" style="margin-top:5pt"><b>Also built:</b> ${R.also.map(a=>`${L(a.name,a.url)} (${esc(a.desc)})`).join(" · ")}</p>`;
  h += `<h2>SKILLS</h2>` + R.skills.map(([k,v])=>`<div class="skill"><b>${esc(k)}:</b> ${esc(v)}</div>`).join("");
  h += `<h2>EDUCATION</h2>` + R.education.map((e,i)=>row(`<b>${esc(e.deg)}</b>${e.org ? " — "+esc(e.org) : ""}`,e.date,!i)).join("");
  return h;
}

function fit(){
  const page = document.getElementById("page"), stage = document.getElementById("stage");
  page.style.transform = "none";
  const w = page.offsetWidth, h = page.offsetHeight;
  const s = Math.min(1, (document.documentElement.clientWidth - 24) / w);
  page.style.transform = `scale(${s})`;
  stage.style.width = (w*s) + "px";
  stage.style.height = (h*s) + "px";
}

/* ---------- Text-based PDF (ATS-Safe Vector Stream) ---------- */
const PW=595.28, PH=841.89, ML=40, MR=40, MT=36, MB=34, W=PW-ML-MR;
const NAVY=[29,53,87], INK=[20,20,20], MUTED=[85,85,85], SOFT=[60,60,60], RULE=[200,204,210];

function layout(doc, fs, draw){
  const lh = fs*1.34;
  let y = MT;
  const setF = (st,sz,c) => { doc.setFont("helvetica",st); doc.setFontSize(sz); if(c) doc.setTextColor(c[0],c[1],c[2]); };
  const base = (top,sz,l) => top + (l - sz)/2 + sz*0.8;

  function rich(segs, x, maxW, sz, color, l){
    const toks = [];
    segs.forEach(s => {
      if(!s || !s.t) return;
      s.t.split(" ").forEach(w => {
        if(w) toks.push({w, st:s.b?"bold":(s.i?"italic":"normal"), u:s.u||""});
      });
    });
    const lines = []; let cur = [], cx = 0;
    toks.forEach(tk => {
      setF(tk.st, sz);
      const ww = doc.getTextWidth(tk.w), sp = doc.getTextWidth(" ");
      if(cur.length && cx + sp + ww > maxW){ lines.push(cur); cur = []; cx = 0; }
      tk.x = cur.length ? cx + sp : 0; tk.ww = ww; cx = tk.x + ww; cur.push(tk);
    });
    if(cur.length) lines.push(cur);
    if(draw) lines.forEach((ln,li) => {
      const by = base(y + li*l, sz, l);
      for(let i=0; i<ln.length;){
        let j = i, txt = ln[i].w;
        while(j+1 < ln.length && ln[j+1].st === ln[i].st && ln[j+1].u === ln[i].u){ j++; txt += " " + ln[j].w; }
        setF(ln[i].st, sz, color);
        doc.text(txt, x + ln[i].x, by);
        if(ln[i].u) doc.link(x + ln[i].x, by - sz*0.8, ln[j].x + ln[j].ww - ln[i].x, sz, {url: ln[i].u});
        i = j + 1;
      }
    });
    return lines.length;
  }

  function heading(t){
    y += 8;
    if(draw){
      setF("bold",10.5,NAVY); doc.text(t, ML, base(y,10.5,14));
      doc.setDrawColor(RULE[0],RULE[1],RULE[2]); doc.setLineWidth(0.8); doc.line(ML, y+16, PW-MR, y+16);
    }
    y += 21;
  }
  function row(segs, date, first){
    if(!first) y += 5;
    setF("normal", fs);
    const dw = date ? doc.getTextWidth(date) : 0;
    const n = rich(segs, ML, W - dw - 14, fs, INK, lh);
    if(draw && date){ setF("normal", fs, SOFT); doc.text(date, PW-MR, base(y,fs,lh), {align:"right"}); }
    y += n*lh;
  }
  function bullets(list){
    list.forEach(b => {
      if(draw){ setF("normal", fs, MUTED); doc.text("•", ML+3, base(y,fs,lh)); }
      const n = rich([{t:b}], ML+12, W-12, fs, INK, lh);
      y += n*lh + 0.8;
    });
  }

  // Header
  if(draw){ setF("bold",20,INK); doc.text(R.name, ML, base(y,20,24)); }
  y += 24;
  if(draw){ setF("bold",11,NAVY); doc.text(R.title, ML, base(y,11,15)); }
  y += 16;
  R.contact.forEach(line => {
    const segs = []; line.forEach((c,i) => { if(i) segs.push({t:"·"}); segs.push({t:c.t, u:c.u}); });
    y += rich(segs, ML, W, 8.8, SOFT, 12) * 12;
  });

  heading("SUMMARY");
  y += rich([{t:R.summary}], ML, W, fs, INK, lh) * lh;

  heading("EXPERIENCE");
  R.experience.forEach((e,i) => { row([{t:e.role,b:1},{t:e.org ? "— "+e.org : ""}], e.date, i===0); y += 1; bullets(e.bullets); });

  heading("PROJECTS");
  R.projects.forEach((p,i) => {
    row([{t:p.name,b:1,u:p.url},{t:"— "+p.desc}], p.date, i===0);
    const sl = 8.8*1.32;
    y += rich([{t:p.stack,i:1}], ML, W, 8.8, MUTED, sl) * sl;
    bullets(p.bullets);
  });
  y += 5;
  const asegs = [{t:"Also built:",b:1}];
  R.also.forEach((a,i) => { if(i) asegs.push({t:"·"}); asegs.push({t:a.name,u:a.url}); asegs.push({t:"("+a.desc+")"}); });
  y += rich(asegs, ML, W, fs, INK, lh) * lh;

  heading("SKILLS");
  R.skills.forEach(([k,v]) => { y += rich([{t:k+":",b:1},{t:v}], ML, W, fs, INK, lh) * lh; });

  heading("EDUCATION");
  R.education.forEach((e,i) => row([{t:e.deg,b:1},{t:e.org ? "— "+e.org : ""}], e.date, i===0));

  return y;
}

function calculateFit(){
  if(!window.jspdf) return { fs: 9.8, height: 0, pct: 96 };
  const { jsPDF } = window.jspdf;
  let fs = 9.8;
  let finalH = 0;
  while(true){
    const probe = new jsPDF({unit:"pt", format:"a4"});
    finalH = layout(probe, fs, false);
    if(finalH <= PH - MB || fs <= 8.2) break;
    fs = +(fs - 0.2).toFixed(2);
  }
  const pct = Math.round((finalH / (PH - MB)) * 100);
  return { fs, height: finalH, pct };
}

function updateBudget(){
  const { fs, pct } = calculateFit();
  const badge = document.getElementById("budgetBadge");
  badge.textContent = `A4 Fit: ${pct}% (${fs}pt)`;
  badge.className = "badge " + (pct > 100 ? "overflow" : (pct > 97 ? "warn" : "fit"));
}

function makePDF(){
  const { jsPDF } = window.jspdf;
  const { fs } = calculateFit();
  const doc = new jsPDF({unit:"pt", format:"a4"});
  doc.setProperties({
    title: `${R.name} - Resume`,
    author: R.name,
    subject: R.title,
    keywords: "Full-Stack Product Engineer, React, Next.js, TypeScript, Node.js, Supabase, PostgreSQL, Playwright"
  });
  layout(doc, fs, true);
  return doc;
}

/* ---------- Word (.doc) ---------- */
function wordHTML(){
  const L = (t,u) => u ? `<a href="${u}">${esc(t)}</a>` : esc(t);
  const H = t => `<h2>${t}</h2>`;
  const row = (left,date,first) => `<p style="margin-top:${first?0:5}pt">${left}${date ? ` &nbsp;|&nbsp; <span style="color:#3C3C3C">${esc(date)}</span>` : ""}</p>`;
  const ul = list => `<ul style="margin-top:1pt;margin-bottom:0">${list.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`;
  let h = `<h1>${esc(R.name)}</h1><p class="t">${esc(R.title)}</p>`;
  h += R.contact.map(l => `<p class="c">${l.map(c=>L(c.t,c.u)).join(" · ")}</p>`).join("");
  h += H("SUMMARY") + `<p>${esc(R.summary)}</p>`;
  h += H("EXPERIENCE") + R.experience.map((e,i)=>row(`<b>${esc(e.role)}</b>${e.org?" — "+esc(e.org):""}`,e.date,!i)+ul(e.bullets)).join("");
  h += H("PROJECTS") + R.projects.map((p,i)=>row(`<b>${L(p.name,p.url)}</b> — ${esc(p.desc)}`,p.date,!i)+`<p class="s">${esc(p.stack)}</p>`+ul(p.bullets)).join("");
  h += `<p style="margin-top:5pt"><b>Also built:</b> ${R.also.map(a=>`${L(a.name,a.url)} (${esc(a.desc)})`).join(" · ")}</p>`;
  h += H("SKILLS") + R.skills.map(([k,v])=>`<p><b>${esc(k)}:</b> ${esc(v)}</p>`).join("");
  h += H("EDUCATION") + R.education.map((e,i)=>row(`<b>${esc(e.deg)}</b>${e.org ? " — "+esc(e.org) : ""}`,e.date,!i)).join("");
  const css = `@page WordSection1{size:595.3pt 841.9pt;margin:32pt 40pt 30pt 40pt}
div.WordSection1{page:WordSection1}
body{font-family:Arial,Helvetica,sans-serif;font-size:9.5pt;color:#141414}
p{margin:0;line-height:125%}
h1{font-size:19pt;margin:0;color:#141414}
h2{font-size:10.5pt;color:#1D3557;margin:8pt 0 3pt 0;padding-bottom:2pt;border-bottom:solid #C8CCD2 1.0pt}
.t{font-size:11pt;color:#1D3557;font-weight:bold}
.c{font-size:8.8pt;color:#3C3C3C}
.s{font-size:8.8pt;color:#555555;font-style:italic}
li{margin:0;line-height:125%}
a{color:#141414;text-decoration:none}`;
  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${esc(R.name)} - Resume</title><style>${css}</style></head><body><div class="WordSection1">${h}</div></body></html>`;
}

function download(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

function render(){
  document.getElementById("page").innerHTML = previewHTML();
  fit();
  updateBudget();
}

window.addEventListener("resize", fit);
window.addEventListener("DOMContentLoaded", render);

document.getElementById("pdfBtn").addEventListener("click", () => {
  try{
    if(!window.jspdf){ status("PDF library didn't load. Use Print → Save as PDF instead."); return; }
    const doc = makePDF();
    const filename = `${R.name.replace(/\s+/g,"_")}_Resume.pdf`;
    download(doc.output("blob"), filename);
    status(`PDF downloaded: ${filename} (exact 1-page A4, vector text).`);
  }catch(e){
    console.error(e);
    status("PDF download was blocked here. Use Print → Save as PDF instead.");
  }
});

document.getElementById("docBtn").addEventListener("click", () => {
  try{
    const filename = `${R.name.replace(/\s+/g,"_")}_Resume.doc`;
    download(new Blob(["\ufeff", wordHTML()], {type:"application/msword;charset=utf-8"}), filename);
    status(`Word file downloaded: ${filename}. Open and Save As → .docx if portal requires .docx.`);
  }catch(e){ status("Word download was blocked here: " + e.message); }
});

document.getElementById("printBtn").addEventListener("click", () => {
  try{ window.print(); }catch(e){ status("Print isn't available in this view."); }
});

// JSON Customization Drawer
const drawer = document.getElementById("drawer");
const backdrop = document.getElementById("backdrop");
const jsonEditor = document.getElementById("jsonEditor");

document.getElementById("editBtn").addEventListener("click", () => {
  jsonEditor.value = JSON.stringify(R, null, 2);
  drawer.classList.add("open");
  backdrop.style.display = "block";
});

function closeDrawer(){
  drawer.classList.remove("open");
  backdrop.style.display = "none";
}

document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
backdrop.addEventListener("click", closeDrawer);

document.getElementById("applyDataBtn").addEventListener("click", () => {
  try{
    const parsed = JSON.parse(jsonEditor.value);
    R = parsed;
    localStorage.setItem("mohit_resume_classic_data", JSON.stringify(R));
    render();
    closeDrawer();
    status("Resume updated and persisted to localStorage.");
  }catch(err){
    alert("Invalid JSON: " + err.message);
  }
});

document.getElementById("resetDataBtn").addEventListener("click", () => {
  if(confirm("Reset all resume data to default?")){
    R = JSON.parse(JSON.stringify(DEFAULT_DATA));
    localStorage.removeItem("mohit_resume_classic_data");
    jsonEditor.value = JSON.stringify(R, null, 2);
    render();
    closeDrawer();
    status("Resume reset to default configuration.");
  }
});

render();
</script>
</body>
</html>
